
services:
  hadoop:
    build:
      context: ./hadoop
    image: examen-hadoop
    container_name: examen-hadoop
    volumes:
      - ./data:/data/input:ro
      - ./mapreduce:/app/mapreduce:ro
      - ./resultados:/data/output
      - ./ssh/id_ed25519.pub:/tmp/cliente_ssh.pub:ro
    networks:
      - datamart_net
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/output/resultado/part-00000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  db:
    image: mysql:8.0
    container_name: examen-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - datamart_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: examen-api
    ports:
      - "${API_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    volumes:
      - ./ssh/id_ed25519:/tmp/cliente_ssh:ro
      - ./resultados:/data/output:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      hadoop:
        condition: service_healthy
    networks:
      - datamart_net

volumes:
  mysql_data:

networks:
  datamart_net:
    driver: bridge
